[package]
name = "rust_diesel_api"
version = "0.1.0"
edition = "2021"

[dependencies]
warp = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "numeric"] }  
diesel_migrations = "2.0"
jsonwebtoken = "8.1"
bcrypt = "0.13"
dotenv = "0.15"
bigdecimal = { version = "0.4", features = ["serde"] }  
r2d2 = "0.8.10"
chrono = "0.4.42"
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"


